    ]
}






tasks.register('history') {
    group = 'vcs'
    description = 'Step by step, finds the last compilable revision and saves the diff of the failing commit'

    doLast {
        def git = { String cmd ->
            def out = new ByteArrayOutputStream()
            exec {
                commandLine 'git', *cmd.split()
                standardOutput = out
                errorOutput = System.err
                ignoreExitValue = true
            }
            out.toString().trim()
        }

        final def originalHead = git('rev-parse HEAD')
        println "Original HEAD: $originalHead"

        final def commits = git('rev-list --reverse HEAD').readLines()
        println "Total commits: ${commits.size()}"

        String lastWorking = null
        String nextAfterWorking = null

        for (int i = commits.size() - 1; i >= 0; i--) {
            final def hash = commits[i]
            println "\nChecking commit: $hash"

            exec { commandLine 'git', 'checkout', hash }

            def compileResult = exec {
                ignoreExitValue = true
                commandLine 'cmd', '/c', 'gradlew.bat', 'clean', 'compileJava', '--no-daemon'
            }

            if (compileResult.exitValue == 0) {
                lastWorking = hash
                if (i + 1 < commits.size()) {
                    nextAfterWorking = commits[i + 1]
                }
                println "Build successful at commit: $hash"
                break
            } else {
                println "Build failed at commit: $hash (exit code ${compileResult.exitValue})"
            }
        }

        if (lastWorking == null) {
            println "No working revision found in history."
        } else if (nextAfterWorking == null) {
            println "Current HEAD is already working. No diff needed."
        } else {
            println "Last working commit: $lastWorking"
            println "First failing commit: $nextAfterWorking"

            def diffFile = file("$buildDir/last_failed_diff_${nextAfterWorking.take(7)}.patch")
            diffFile.text = git("diff $lastWorking $nextAfterWorking")
            println "Diff saved to: ${diffFile}"
        }

        exec { commandLine 'git', 'checkout', originalHead }
    }
}
tasks.register('my_junit_tests', Test) {
    group = 'verification'
    description = 'Запуск junit-тестов проекта после сборки'
    dependsOn 'build'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()
}

tasks.register('report') {
    group       = 'verification'
    description = 'Сохраняет JUnit-отчёт и коммитит его в git, если тесты прошли успешно'
    dependsOn   'my_junit_tests'

    doLast {
        def testTask = tasks.named('my_junit_tests').get()
        if (testTask.state.failure) {
            println 'Test failed'
            return
        }

        def junitSrc = file("$buildDir/test-results/${testTask.name}")
        if (!junitSrc.exists()) {
            println "report JUnit not found on the way $junitSrc"
            return
        }

        def destDir = file('junit-reports')
        copy {
            from junitSrc
            into destDir
        }
        println "report copy to $destDir"

        exec { commandLine 'git', 'add', destDir }

        def statusOut = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'status', '--porcelain'
            standardOutput = statusOut
        }

        if (statusOut.toString().trim()) {
            exec {
                commandLine 'git', 'commit', '-m', "JUnit report: ${new Date().format('yyyy-MM-dd HH:mm:ss')}"
            }
            println 'report was commited'
        } else {
            println 'not changes - we dont need commit'
        }
    }
}

tasks.named('my_junit_tests').configure {
    finalizedBy 'report'
}









