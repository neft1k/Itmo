        println " Zapusk Spring Boot (jar) in this terminal..."
        exec {
            commandLine(["java"] + jvmArgs + ["-jar", jarFile.absolutePath])
        }
    }
}



tasks.register('native2asciiCopy') {
    group       = 'build'
    description = 'Конвертирует *.properties -> ASCII'

    def srcDir     = file('src/main/resources')
    def targetDir  = file("$buildDir/native2ascii")
    def srcEncoding = 'windows-1251'

    inputs.dir(srcDir)
    outputs.dir(targetDir)

    doLast {
        delete targetDir; mkdir targetDir

        ant.native2ascii(src : srcDir, dest : targetDir, encoding : srcEncoding, includes : '**/*.properties', ext : '.properties')
        println "convrting in $targetDir "
    }
}

tasks.register('my_test', JavaExec) {
    group = 'verification'
    description = 'Запуск Selenium UI тестов'

    dependsOn 'build'

    classpath = sourceSets.functionalTest.runtimeClasspath
    mainClass = 'org.junit.platform.console.ConsoleLauncher'

