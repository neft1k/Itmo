services:
  pg:
    image: postgres:16
    # platform: linux/amd64  # если на M1/M2 что-то пойдёт не так — раскомментируй
    environment:
      POSTGRES_DB: studs
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d studs"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./backend/src/main/resources/META-INF/db/functions.sql:/docker-entrypoint-initdb.d/001-functions.sql:ro
      - pgdata:/var/lib/postgresql/data

  # pgAdmin Web UI
  pgadmin:
    image: dpage/pgadmin4:8.12
    depends_on:
      pg:
        condition: service_started
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: pg
      DB_PORT: 5432
      DB_NAME: studs
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-imports}
    depends_on:
      pg:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"   # приложение
      - "9990:9990"   # WildFly admin (опционально)

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgadmin:
  minio-data:
