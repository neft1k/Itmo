<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core">
<head>
    <meta charset="UTF-8"/>
    <title>JSF форма</title>
    <style>
        /* Общий стиль для тела страницы */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #f0f4f8, #d9e2ec);
            margin: 0;
            padding: 0;
        }

        /* Общий контейнер для всех элементов */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Стиль для каждой отдельной формы */
        .form-container {
            width: 80%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
        }

        /* Стиль для холста графика */
        .graph-container {
            width: 80%;
            max-width: 600px;
            text-align: center;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
        }

        #coordinate-plane {
            border: 2px solid #4dabf7;
            width: 300px;
            height: 300px;
            background-color: #f0faff;
            border-radius: 8px;
        }

        /* Стиль для таблицы */
        .table-container {
            width: 80%;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
        }

        .styled-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-radius: 10px;
        }

        .styled-table thead tr {
            background-color: #006d77;
            color: #ffffff;
            text-align: center;
        }

        .styled-table th, .styled-table td {
            padding: 15px;
            border: 1px solid #dddddd;
            text-align: center;
        }

        .styled-table tbody tr {
            border-bottom: 1px solid #dddddd;
            transition: background-color 0.2s ease-in-out;
        }

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #ffffff;
        }

        .styled-table tbody tr:hover {
            background-color: #ffffff;
            cursor: pointer;
        }


    </style>
    <script>
        let points = [];

        // Функция рисования областей на графике
        function drawArea(r) {
            const canvas = document.getElementById("coordinate-plane");
            const ctx = canvas.getContext("2d");
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 150 / r;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем области на графике
            ctx.fillStyle = "rgba(0, 0, 255, 0.5)";
            ctx.fillRect(centerX , centerY , r * scale, (r/2) * scale);

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, (r / 2) * scale, Math.PI / 2, -Math.PI, false);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX - (r / 2) * scale, centerY);
            ctx.lineTo(centerX, centerY - r * scale);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "black";
            ctx.beginPath();
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, canvas.height);
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.stroke();

            ctx.font = "12px Arial";
            ctx.fillStyle = "black";
            ctx.fillText("-R", centerX - r * scale, centerY + 15);
            ctx.fillText("-R/2", centerX - r * scale / 2, centerY + 15);
            ctx.fillText("R/2", centerX + r * scale / 2, centerY + 15);
            ctx.fillText("R", centerX + r * scale, centerY + 15);
            ctx.fillText("-R", centerX + 5, centerY + r * scale);
            ctx.fillText("-R/2", centerX + 5, centerY + r * scale / 2);
            ctx.fillText("R/2", centerX + 5, centerY - r * scale / 2);
            ctx.fillText("R", centerX + 5, centerY - r * scale);

            // Рисуем сохраненные точки
            points.forEach(point => drawPoint(parseFloat(point.x), parseFloat(point.y), point.isInside, r));
        }

        // Проверка попадания точки в область
        function isPointInside(x, y, r) {
            // Проверка попадания для области, которую вы рисуете (например, четверть круга и прямоугольник)
            return ((x &lt;= 0 &amp;&amp; y &lt;= 0 &amp;&amp; x * x + y * y &lt;= r * r / 4) || (x >= 0 &amp;&amp; y &lt;= 0 &amp;&amp; y >= -r/2 &amp;&amp; x &lt;= r) || (x &lt;= 0 &amp;&amp; y >= 0 &amp;&amp; y &lt;= x * 2 + r));
        }

        // Рисование точек на графике
        function drawPoint(x, y, isInside, r) {
            const canvas = document.getElementById("coordinate-plane");
            const ctx = canvas.getContext("2d");
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 150 / r;

            ctx.fillStyle = isInside ? "green" : "red";
            ctx.beginPath();
            ctx.arc(centerX + x * scale, centerY - y * scale, 3, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Добавление точки в localStorage
        function savePointToLocalStorage(x, y, r, isInside) {
            const savedPoints = JSON.parse(localStorage.getItem('points')) || [];
            savedPoints.push({ x, y, r, isInside });
            localStorage.setItem('points', JSON.stringify(savedPoints));
        }

        // Обработчик клика по графику
        function onCanvasClick(event) {
            let rRadios = document.querySelectorAll('#coordinateForm input[type="radio"]');
            let rValue = null;

            // Проверяем выбранное значение радиокнопок
            for (const radio of rRadios) {
                if (radio.checked) {
                    rValue = parseFloat(radio.value);
                    break;
                }
            }

            if (rValue === null) {
                alert("Пожалуйста, выберите значение R перед кликом на плоскости.");
                return;
            }

            const canvas = document.getElementById("coordinate-plane");
            const rect = canvas.getBoundingClientRect();
            const x = ((event.clientX - rect.left - 150) / (150 / rValue)).toFixed(2);
            const y = (-(event.clientY - rect.top - 150) / (150 / rValue)).toFixed(2);

            const isInside = isPointInside(parseFloat(x), parseFloat(y), rValue);

            // Сохраняем точку в localStorage
            savePointToLocalStorage(x, y, rValue, isInside);

            // Отправляем координаты
            saveCoordinates(x, y, rValue);

            // Перерисовываем область и точки
            drawArea(rValue);
        }

        // Отправка координат через форму
        function saveCoordinates(x, y, r) {
            var form = document.getElementById('coordinateForm');
            var xField = document.getElementById('coordinateForm:x');
            xField.value = x;
            var yField = document.getElementById('coordinateForm:y');
            yField.value = y;
            var rField = document.getElementById('coordinateForm:r');
            rField.value = r;
            var submitButton = document.getElementById('coordinateForm:submitButton');
            submitButton.click();
        }

        // Восстановление точек при загрузке страницы
        document.addEventListener("DOMContentLoaded", function () {
            let rRadios = document.querySelectorAll('#coordinateForm input[type="radio"]');
            let rValue = 1;
            for (const radio of rRadios) {
                if (radio.checked) {
                    rValue = parseFloat(radio.value);
                    break;
                }
            }

            // Восстанавливаем сохраненные точки
            const savedPoints = JSON.parse(localStorage.getItem('points')) || [];
            points = savedPoints; // Обновляем глобальный массив точек

            // Отрисовываем области и точки
            drawArea(rValue);
        });

        // Обработчик события изменения радиуса
        function updateGraph() {
            let rRadios = document.querySelectorAll('#coordinateForm input[type="radio"]');
            let rValue = null;

            for (const radio of rRadios) {
                if (radio.checked) {
                    rValue = parseFloat(radio.value);
                    break;
                }
            }

            if (rValue === null) {
                return;
            }

            drawArea(rValue);
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Delete") {
                localStorage.removeItem('points');
            }
        });
    </script>
</head>
<body>

<div class="container">
    <!-- Первая форма -->
    <div class="form-container">
        <h:form id="coordinateForm">
            <!-- Поле для выбора R -->
            <h:outputLabel value="Выберите R: " for="r" />
            <h:selectOneRadio id="r" value="#{coordinateBean.r}" required="true" onchange="updateGraph()">
                <f:selectItem itemValue="1" itemLabel="1" />
                <f:selectItem itemValue="1.5" itemLabel="1.5" />
                <f:selectItem itemValue="2" itemLabel="2" />
                <f:selectItem itemValue="2.5" itemLabel="2.5" />
                <f:selectItem itemValue="3" itemLabel="3" />
            </h:selectOneRadio>
            <h:message for="r" />
            <br /><br />

            <!-- Поле для X -->
            <h:outputLabel for="x" value="X: " />
            <h:inputText id="x" value="#{coordinateBean.x}" required="true" label="X" />
            <h:message for="x" />
            <br /><br />

            <!-- Поле для Y -->
            <h:outputLabel for="y" value="Y: " />
            <h:inputText id="y" value="#{coordinateBean.y}" required="true" label="Y">
                <f:validateDoubleRange minimum="-3" maximum="3" errorMessage="Значение Y должно быть в пределах от -3 до 3" />
            </h:inputText>
            <h:message for="y" />
            <br /><br />

            <!-- Кнопка для отправки формы -->
            <h:commandButton id="submitButton" value="Добавить" action="#{coordinateBean.saveCoordinates}" process="@form" update="coordinatesTable"/>
        </h:form>
    </div>

    <!-- Вторая форма -->
    <div class="form-container">
        <h:form id="coordinateForm2">
            <!-- Поле для выбора R с Checkboxes -->
            <h:outputLabel value="Выберите R:" />
            <h:panelGrid columns="2">
                <h:selectBooleanCheckbox id="r1" value="#{coordinateBean.r1}" />
                <h:outputLabel for="r1" value="1" />

                <h:selectBooleanCheckbox id="r1_5" value="#{coordinateBean.r1_5}" />
                <h:outputLabel for="r1_5" value="1.5" />

                <h:selectBooleanCheckbox id="r2" value="#{coordinateBean.r2}" />
                <h:outputLabel for="r2" value="2" />

                <h:selectBooleanCheckbox id="r2_5" value="#{coordinateBean.r2_5}" />
                <h:outputLabel for="r2_5" value="2.5" />

                <h:selectBooleanCheckbox id="r3" value="#{coordinateBean.r3}" />
                <h:outputLabel for="r3" value="3" />
            </h:panelGrid>
            <br /><br />

            <!-- Поле для X -->
            <h:outputLabel value="X: " />
            <div>
                <h:commandButton value="-3" action="#{coordinateBean.setXAndUpdate(-3)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="-2" action="#{coordinateBean.setXAndUpdate(-2)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="-1" action="#{coordinateBean.setXAndUpdate(-1)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="0" action="#{coordinateBean.setXAndUpdate(0)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="1" action="#{coordinateBean.setXAndUpdate(1)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="2" action="#{coordinateBean.setXAndUpdate(2)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="3" action="#{coordinateBean.setXAndUpdate(3)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="4" action="#{coordinateBean.setXAndUpdate(4)}" process="@form" update="coordinatesTable" />
                <h:commandButton value="5" action="#{coordinateBean.setXAndUpdate(5)}" process="@form" update="coordinatesTable" />
            </div>
            <h:message for="x" />
            <br /><br />

            <!-- Поле для Y -->
            <h:outputLabel for="y" value="Y: " />
            <h:inputText id="y" value="#{coordinateBean.y}" required="true" label="Y">
                <f:validateDoubleRange minimum="-3" maximum="3" errorMessage="Значение Y должно быть в пределах от -3 до 3" />
            </h:inputText>
            <h:message for="y" />
            <br /><br />
        </h:form>
    </div>

    <!-- График -->
    <div class="graph-container">
        <h:outputText value="Нажмите на график для вычисления координат:" />
        <canvas id="coordinate-plane" width="300" height="300" onclick="onCanvasClick(event)"></canvas>
    </div>

    <!-- Таблица для отображения координат и результатов -->
    <div class="table-container">
        <h:dataTable value="#{coordinateBean.coordinates}" var="coordinate" styleClass="styled-table">
            <f:facet name="header">
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                </tr>
            </f:facet>
            <h:column>
                <h:outputText value="#{coordinate.x}" />
            </h:column>
            <h:column>
                <h:outputText value="#{coordinate.y}" />
            </h:column>
            <h:column>
                <h:outputText value="#{coordinate.r}" />
            </h:column>
            <h:column>
                <h:outputText value="#{coordinate.result}" />
            </h:column>
        </h:dataTable>
    </div>

    <!-- Ссылка на основную страницу -->
    <h:link value="Перейти на основную страницу" outcome="main.xhtml" />
</div>

</body>
</html>
