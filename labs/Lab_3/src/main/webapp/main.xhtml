<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html">
<h:head>
    <title>Шапка с часами</title>
    <style>
        /* Общие стили страницы */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            padding-top: 80px; /* Отступ для шапки */
        }

        /* Шапка - закреплена сверху */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #8B00FF;
            color: white;
            padding: 10px 20px;
            text-align: center;
            z-index: 10; /* чтобы шапка была поверх контента */
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header p {
            margin: 5px 0;
            font-size: 16px;
        }

        /* Стили для блока с часами */
        #clock {
            font-family: 'Courier New', Courier, monospace;
            font-size: 48px;  /* Увеличиваем размер шрифта */
            color: #4CAF50;   /* Зеленый цвет для текста */
            padding: 20px;
            background-color: #fff;  /* Белый фон */
            border-radius: 15px; /* Скругленные углы */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); /* Тень вокруг блока */
            text-align: center; /* Центрируем текст */
            margin-top: 80px; /* Отступ сверху */
            width: auto;
            min-width: 300px;  /* Минимальная ширина блока */
            border: 3px solid #8B00FF;  /* Зеленая рамка вокруг */
        }

        /* Стили для ссылки */
        h:link {
            margin-top: 20px;
            font-size: 16px;
            color: #007bff;
            text-decoration: none;
        }

        h:link:hover {
            text-decoration: underline;
        }
    </style>

    <script type="text/javascript">
        // Функция для обновления времени
        function updateTime() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            var date = now.toLocaleDateString();

            // Форматируем время
            if (minutes &lt; 10) minutes = '0' + minutes;
            if (seconds &lt; 10) seconds = '0' + seconds;

            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').innerHTML = date + ' ' + timeString;
        }

        // Обновляем время каждые 11 секунд
        setInterval(updateTime, 11000);
    </script>
</h:head>
<h:body onload="updateTime()">
    <!-- Шапка -->
    <div class="header">
        <h1>ФИО Студента: Зиятдинов Карим Ильдарович</h1>
        <p>Группа: P3213, Вариант: 889</p>
    </div>

    <!-- Часы -->
    <div id="clock"></div>

    <!-- Ссылка на основную страницу -->
    <h:link value="Перейти на основную страницу" outcome="index.xhtml" />
</h:body>
</html>
