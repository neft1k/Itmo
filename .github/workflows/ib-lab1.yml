name: Notes API checks

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: labs/IB_LAB1

permissions:
  contents: read

jobs:
  tests-and-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labs/IB_LAB1/pom.xml
      - name: Build and integration tests
        run: ./mvnw -B -ntp verify
      - name: SAST — SpotBugs and Find Security Bugs
        run: ./mvnw -B -ntp spotbugs:check
      - name: Save test and SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-sast
          path: |
            labs/IB_LAB1/target/surefire-reports/
            labs/IB_LAB1/target/spotbugsXml.xml

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: labs/IB_LAB1/pom.xml
      - name: SCA — OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp dependency-check:check
      - name: Save dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca
          path: labs/IB_LAB1/target/dependency-check-report.*
